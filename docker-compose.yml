---
name: peacock
services:
  peacock:
    image: ghcr.io/gsquarediv/peacock-docker:latest
    volumes:
      - userdata:/peacock/userdata
      - contracts:/peacock/contracts
      - contractSessions:/peacock/contractSessions
      - plugins:/peacock/plugins
      - options:/peacock/options
    ports:
      - 3000:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000 -o /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
volumes:
  userdata:
  contracts:
  contractSessions:
  plugins:
  options: